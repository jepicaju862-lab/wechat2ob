name: Build, attest, and publish client release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Verify client-only tracked tree and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-public.mjs --tracked
      - name: Install plugin build dependencies
        run: npm ci
      - name: Build and test client
        run: npm run verify
      - name: Ensure verification did not modify source
        run: git diff --exit-code
      - name: Generate build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/main.js
            ${{ github.workspace }}/manifest.json
            ${{ github.workspace }}/styles.css
      - name: Publish the three standard plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp RELEASE_NOTES.md .artifacts/release-body.md
          printf '\nCorresponding source and license: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> .artifacts/release-body.md
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "WeChat2Ob ${RELEASE_TAG}" --notes-file .artifacts/release-body.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            main.js manifest.json styles.css
